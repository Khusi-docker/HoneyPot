<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CC-CAM - Noise Simulation</title>
<style>
  body {
    margin: 0;
    padding: 0;
    background: #0b0b0f;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: #fff;
  }

  .header {
    text-align: center;
    padding: 15px 10px;
    background: linear-gradient(90deg, #00c6ff, #0072ff);
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 1.2px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.6);
  }

  .container {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-gap: 12px;
    padding: 12px;
  }

  .camera {
    position: relative;
    background-color: #111;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.6);
    aspect-ratio: 16/9;
    transition: transform 0.3s ease;
  }

  .camera:hover {
    transform: scale(1.03);
  }

  canvas {
    width: 100%;
    height: 100%;
    display: block;
  }

  .label {
    position: absolute;
    top: 6px;
    left: 6px;
    background: rgba(0,0,0,0.6);
    padding: 3px 6px;
    border-radius: 4px;
    font-size: 12px;
    color: #00ffff;
    font-weight: 500;
    z-index: 1;
  }

  .footer {
    text-align: center;
    padding: 10px;
    background: linear-gradient(90deg, #0072ff, #00c6ff);
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 1px;
  }

  @media (max-width: 1200px) { .container { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 900px) { .container { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 600px) { .container { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div class="header">CC-CAM Simulation</div>

<div class="container">
  <!-- Generate 12 noise cameras -->
  <script>
    const container = document.currentScript.parentElement;

    for(let i=1; i<=12; i++){
      const camDiv = document.createElement('div');
      camDiv.className = 'camera';
      const label = document.createElement('div');
      label.className = 'label';
      label.textContent = 'Camera ' + i;
      const canvas = document.createElement('canvas');
      canvas.width = 480;
      canvas.height = 270;
      camDiv.appendChild(canvas);
      camDiv.appendChild(label);
      container.appendChild(camDiv);

      const ctx = canvas.getContext('2d');

      // Noise animation function
      function drawNoise(){
        const imageData = ctx.createImageData(canvas.width, canvas.height);
        const data = imageData.data;
        for(let j=0; j<data.length; j+=4){
          const shade = Math.floor(Math.random()*255);
          data[j] = data[j+1] = data[j+2] = shade; // grayscale
          data[j+3] = 255; // alpha
        }
        ctx.putImageData(imageData, 0, 0);
        requestAnimationFrame(drawNoise);
      }
      drawNoise();
    }
  </script>
</div>

<div class="footer">PhiVault CC-CAM</div>

</body>
</html>
